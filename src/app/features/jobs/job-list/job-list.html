<h2>Список вакансій</h2>

@if (store.isLoading()) {
  <p>Завантаження вакансій...</p>
} @else if (store.error()) {
  <div class="error">
    <p>Не вдалося завантажити дані.</p>
    <button type="button" (click)="store.reload()">Спробувати знову</button>
  </div>
} @else if (store.jobs().length > 0) {
  <ul>
    @for (job of store.jobs(); track job.id) {
      <li>
        <app-job-card [job]="job" />
      </li>
    } @empty {
      <li>Наразі немає доступних вакансій.</li>
    }
  </ul>
}
