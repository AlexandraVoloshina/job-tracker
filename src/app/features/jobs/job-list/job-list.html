<h2>Список вакансій</h2>

@if (jobsResource.isLoading()) {
  <p>Завантаження вакансій...</p>
} @else if (jobsResource.error()) {
  <div class="error">
    <p>Не вдалося завантажити дані.</p>
    <button type="button" (click)="jobsResource.reload()">Спробувати знову</button>
  </div>
} @else if (jobsResource.hasValue()) {
  <ul>
    @for (job of jobsResource.value(); track job.id) {
      <app-job-card [job]="job" />
    } @empty {
      <li>Наразі немає доступних вакансій.</li>
    }
  </ul>
}
