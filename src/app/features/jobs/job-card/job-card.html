<article class="job-card">
  <h3>{{ job().position }}</h3>
  <p class="company">{{ job().company }}</p>

  @if (job().salary != null) {
    <p class="salary">${{ job().salary | number:'1.0-0' }}</p>
  }

  <time [attr.datetime]="job().appliedAt">{{ job().appliedAt | date:'d MMM y' }}</time>

  <span class="status-badge" [class]="'status-' + job().status">{{ statusLabels[job().status] }}</span>
  
</article>
